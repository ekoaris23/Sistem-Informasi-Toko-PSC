<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSC Service System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        maroon: {
                            600: '#800000',
                            700: '#660000',
                            800: '#4D0000',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Header / Navbar -->
    <header class="bg-maroon-700 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">PSC SERVICE SYSTEM</h1>
            <span id="status-badge" class="text-xs bg-yellow-500 text-black px-2 py-1 rounded font-semibold">Connecting...</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Form Input Data -->
        <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-maroon-700">
            <h2 class="text-lg font-bold mb-4 text-maroon-700">Tambah Data Layanan / Barang</h2>
            <form id="service-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Nama Pelanggan / Item</label>
                    <input type="text" id="itemName" required class="w-full border rounded p-2 focus:outline-none focus:border-maroon-700" placeholder="Contoh: Laptop Asus - Servis LCD">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Biaya / Harga (Rp)</label>
                    <input type="number" id="itemPrice" required class="w-full border rounded p-2 focus:outline-none focus:border-maroon-700" placeholder="150000">
                </div>
                <button type="submit" class="w-full bg-maroon-700 hover:bg-maroon-800 text-white font-bold py-2 rounded transition">Simpan Data</button>
            </form>
        </div>

        <!-- Realtime Data List -->
        <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-maroon-700">
            <h2 class="text-lg font-bold mb-4 text-maroon-700">Daftar Layanan Realtime</h2>
            <ul id="data-list" class="divide-y divide-gray-200 max-h-80 overflow-y-auto">
                <li class="py-3 text-gray-500 text-center">Memuat data...</li>
            </ul>
        </div>

    </main>

    <!-- Firebase SDK (ES Module Integration) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyCUv1FoZD1AhcD8FxeOvaTZ9XZJ_D3i3zc",
            authDomain: "psc-service-system.firebaseapp.com",
            databaseURL: "https://psc-service-system-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "psc-service-system",
            storageBucket: "psc-service-system.firebasestorage.app",
            messagingSenderId: "1060022500226",
            appId: "1:1060022500226:web:bde4e4328e8e3d7ed1ed9b"
        };

        // Inisialisasi Firebase & Realtime Database
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const servicesRef = ref(db, 'services');

        // Status Indikator
        const statusBadge = document.getElementById('status-badge');

        // Simpan Data
        document.getElementById('service-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;

            push(servicesRef, {
                name: name,
                price: parseInt(price),
                timestamp: Date.now()
            }).then(() => {
                document.getElementById('service-form').reset();
            });
        });

        // Baca Data Realtime
        onValue(servicesRef, (snapshot) => {
            statusBadge.textContent = 'Terhubung Realtime';
            statusBadge.className = 'text-xs bg-green-500 text-white px-2 py-1 rounded font-semibold';
            
            const listElement = document.getElementById('data-list');
            listElement.innerHTML = '';

            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach((key) => {
                    const item = data[key];
                    const li = document.createElement('li');
                    li.className = 'py-3 flex justify-between items-center';
                    li.innerHTML = `
                        <span class="font-medium">${item.name}</span>
                        <span class="text-maroon-700 font-bold">Rp ${Number(item.price).toLocaleString('id-ID')}</span>
                    `;
                    listElement.appendChild(li);
                });
            } else {
                listElement.innerHTML = '<li class="py-3 text-gray-400 text-center">Belum ada data.</li>';
            }
        }, (error) => {
            statusBadge.textContent = 'Gagal Konek';
            statusBadge.className = 'text-xs bg-red-500 text-white px-2 py-1 rounded font-semibold';
        });
    </script>
</body>
</html>
